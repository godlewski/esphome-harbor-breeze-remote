# Harbor Breeze DC ceiling fans (remote FCC ID A25-TX012, 315 MHz) via an ESP32 + CC1101.
# Per fan: a fan entity (6 speeds, direction, Breeze) plus a button for each other remote button.
# It also listens for the real remotes, so Home Assistant follows them. See README.md.
#
# Edit the fan list below: one entry per fan, each paired to a different remote ID (the 0/1
# switch in the remote's battery compartment, then the learn button; README step 3).

substitutions:
  name: harbor-fans
  friendly_name: Harbor Breeze Fans

packages:
  core: !include harbor-fans.yaml

  fan_1: !include
    file: fan.yaml
    vars:
      fan_id: fan_1            # letters, digits and _ only; unique per fan
      fan_name: Fan 1          # shown in Home Assistant
      remote_id: "010101010101010101010101010101010"   # remote switch on 0

  # Delete this entry if you have one fan.
  fan_2: !include
    file: fan.yaml
    vars:
      fan_id: fan_2
      fan_name: Fan 2
      remote_id: "001011001101010011001101001101001"   # remote switch on 1
